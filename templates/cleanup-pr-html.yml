# Copy this file to .github/workflows/cleanup-pr-html.yml on the default branch.
# Replace <PINNED_SHA> with the commit SHA of stanah/publish-pr-html you reviewed.
name: cleanup-pr-html

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, do not delete
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: stanah/publish-pr-html/cleanup@<PINNED_SHA> # vX.Y.Z
        with:
          release_id: ${{ vars.PR_HTML_RELEASE_ID }}
          max_age_days: '7'
          dry_run: ${{ inputs.dry_run == true && 'true' || 'false' }}
