name: publish-pr-html
description: >-
  Publish a pre-generated, self-contained HTML file as a non-zipped GitHub Actions
  artifact and link it from a dedicated pull request comment. Designed to be
  driven by workflow_dispatch from the publish-pr-html CLI.
author: stanah
branding:
  icon: file-text
  color: blue

inputs:
  pr_number:
    description: Pull request number (positive integer).
    required: true
  head_sha:
    description: Full commit SHA the HTML describes. Must match the current PR head.
    required: true
  request_id:
    description: UUID generated by the CLI for this request.
    required: true
  html_sha256:
    description: SHA-256 (64 lowercase hex) of the original HTML bytes.
    required: true
  transport:
    description: '"inline" (HTML is in the html input) or "release" (HTML is a relay asset).'
    required: true
  html:
    description: HTML content. Required when transport is "inline".
    required: false
    default: ''
  asset_id:
    description: Relay release asset id. Required when transport is "release".
    required: false
    default: ''
  release_id:
    description: Id of the dedicated draft release used as a relay. Usually vars.PR_HTML_RELEASE_ID.
    required: false
    default: ''
  github_token:
    description: Token with contents:write and pull-requests:write on this repository.
    required: false
    default: ${{ github.token }}
  max_bytes:
    description: Maximum HTML size in bytes.
    required: false
    default: '10485760'
  retention_days:
    description: Artifact retention in days. Must be within the repository limit.
    required: false
    default: '30'
  comment_author_id:
    description: User id of the account that writes the comment (github-actions[bot] by default).
    required: false
    default: '41898282'

outputs:
  status:
    description: published, noop, skipped (or empty when a step failed).
    value: ${{ steps.comment.outputs.status || steps.prepare.outputs.status }}
  reason:
    description: Human readable reason for the status.
    value: ${{ steps.comment.outputs.reason || steps.prepare.outputs.reason }}
  artifact_url:
    description: Authenticated URL of the HTML artifact (empty unless published).
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact_id:
    description: Id of the HTML artifact (empty unless published).
    value: ${{ steps.upload.outputs.artifact-id }}
  comment_url:
    description: URL of the dedicated PR comment (empty unless published).
    value: ${{ steps.comment.outputs.comment_url }}

runs:
  using: composite
  steps:
    - id: prepare
      name: Validate request and fetch HTML
      shell: bash
      env:
        PUBLISH_PR_HTML_ACTION_PATH: ${{ github.action_path }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        INPUT_REQUEST_ID: ${{ inputs.request_id }}
        INPUT_HTML_SHA256: ${{ inputs.html_sha256 }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_HTML: ${{ inputs.html }}
        INPUT_ASSET_ID: ${{ inputs.asset_id }}
        INPUT_RELEASE_ID: ${{ inputs.release_id }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_MAX_BYTES: ${{ inputs.max_bytes }}
        INPUT_COMMENT_AUTHOR_ID: ${{ inputs.comment_author_id }}
      run: node "$PUBLISH_PR_HTML_ACTION_PATH/src/action/prepare.mjs"

    - id: upload
      name: Upload HTML as a non-zipped artifact
      if: steps.prepare.outputs.status == 'proceed'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.prepare.outputs.html_path }}
        archive: false
        if-no-files-found: error
        retention-days: ${{ inputs.retention_days }}

    - id: comment
      name: Create or update the PR comment
      if: steps.prepare.outputs.status == 'proceed'
      shell: bash
      env:
        PUBLISH_PR_HTML_ACTION_PATH: ${{ github.action_path }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        INPUT_REQUEST_ID: ${{ inputs.request_id }}
        INPUT_HTML_SHA256: ${{ inputs.html_sha256 }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention_days }}
        INPUT_COMMENT_AUTHOR_ID: ${{ inputs.comment_author_id }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
      run: node "$PUBLISH_PR_HTML_ACTION_PATH/src/action/comment.mjs"

    - id: finalize
      name: Delete the relay asset
      if: steps.prepare.outputs.status == 'proceed' && inputs.transport == 'release'
      shell: bash
      env:
        PUBLISH_PR_HTML_ACTION_PATH: ${{ github.action_path }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_ASSET_ID: ${{ inputs.asset_id }}
        INPUT_RELEASE_ID: ${{ inputs.release_id }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        COMMENT_STATUS: ${{ steps.comment.outputs.status }}
      run: node "$PUBLISH_PR_HTML_ACTION_PATH/src/action/finalize.mjs"
