# Dogfood: uses the action from this repository (default branch, github.sha).
# Other repositories should copy templates/publish-pr-html.yml instead.
name: publish-pr-html
run-name: "publish-pr-html: PR #${{ inputs.pr_number }} (${{ inputs.request_id }})"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full commit SHA the HTML describes
        required: true
        type: string
      request_id:
        description: Request UUID generated by the CLI
        required: true
        type: string
      html_sha256:
        description: SHA-256 of the HTML file
        required: true
        type: string
      transport:
        description: inline or release
        required: true
        type: string
      html:
        description: HTML content (transport=inline)
        required: false
        type: string
        default: ''
      asset_id:
        description: Relay asset id (transport=release)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-pr-html-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          pr_number: ${{ inputs.pr_number }}
          head_sha: ${{ inputs.head_sha }}
          request_id: ${{ inputs.request_id }}
          html_sha256: ${{ inputs.html_sha256 }}
          transport: ${{ inputs.transport }}
          html: ${{ inputs.html }}
          asset_id: ${{ inputs.asset_id }}
          release_id: ${{ vars.PR_HTML_RELEASE_ID }}
