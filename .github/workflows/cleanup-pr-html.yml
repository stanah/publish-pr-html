# Dogfood: uses the cleanup action from this repository (default branch, github.sha).
# Other repositories should copy templates/cleanup-pr-html.yml instead.
name: cleanup-pr-html

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, do not delete
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./cleanup
        with:
          release_id: ${{ vars.PR_HTML_RELEASE_ID }}
          max_age_days: '7'
          dry_run: ${{ inputs.dry_run == true && 'true' || 'false' }}
